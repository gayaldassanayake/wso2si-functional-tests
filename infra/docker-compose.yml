version: '3.8'
name: si-functional-tests

# WSO2 SI Test Suite Infrastructure
# Usage:
#   All services:  docker compose up -d
#   Kafka only:    docker compose up -d zookeeper kafka schema-registry
#   MySQL only:    docker compose up -d mysql

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: si-test-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: si-test-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "8081:8081"   # schema-registry shares this network namespace
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_MS: 3600000
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s

  # Kafka advertises only localhost:9092, so the registry runs in Kafka's network namespace.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: si-test-schema-registry
    network_mode: "service:kafka"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: localhost
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://localhost:9092
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  mysql:
    image: mysql:8.0.32
    container_name: si-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: si_test_db
      MYSQL_USER: sitest
      MYSQL_PASSWORD: sitest123
    ports:
      - "3307:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --authentication-policy=mysql_native_password,,
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --binlog-format=ROW
      --log-bin=mysql-bin
      --server-id=1
      --skip-ssl
      --max-connections=500
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usitest", "-psitest123"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: si-test-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: si-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  samba:
    image: dperson/samba:latest
    container_name: si-test-samba
    command: ["-u", "ubuntu;admin", "-s", "sambashare;/share;yes;no;no;ubuntu", "-p"]
    ports:
      - "445:445"
    healthcheck:
      test: ["CMD", "smbclient", "-L", "//localhost", "-U", "ubuntu%admin"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  ftp:
    image: delfer/alpine-ftp-server:latest
    container_name: si-test-ftp
    environment:
      USERS: "sitest|sitest123|/home/sitest|1000"
      ADDRESS: "127.0.0.1"
      MIN_PORT: "21100"
      MAX_PORT: "21130"
    ports:
      - "2121:21"
      - "21100-21130:21100-21130"
    healthcheck:
      test: ["CMD-SHELL", "pgrep vsftpd"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  sftp:
    image: atmoz/sftp:latest
    container_name: si-test-sftp
    command: ["sitest:sitest123:1001:1001:upload"]
    ports:
      - "2224:22"
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  mongodb:
    image: mongo:8.0
    container_name: si-test-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: sitest
      MONGO_INITDB_ROOT_PASSWORD: sitest123
    entrypoint:
      - bash
      - -c
      - |
        head -c 756 /dev/urandom | base64 > /tmp/mongodb-keyfile
        chmod 400 /tmp/mongodb-keyfile
        chown mongodb:mongodb /tmp/mongodb-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongodb-keyfile
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16
    container_name: si-test-postgres
    environment:
      POSTGRES_DB: si_test_db
      POSTGRES_USER: sitest
      POSTGRES_PASSWORD: sitest123
    ports:
      - "5433:5432"
    # Debezium streams from the logical WAL; the stock config ships wal_level=replica
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=8
      -c max_wal_senders=8
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitest -d si_test_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # TC52: Oracle resolved through LDAP directory naming. Heavy images, so they
  # only start with the "oracle" profile (./scripts/setup.sh --oracle-ldap).
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: si-test-oracle
    profiles: ["oracle"]
    environment:
      ORACLE_PASSWORD: sitest123
      APP_USER: sitest
      APP_USER_PASSWORD: sitest123
    ports:
      - "1522:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  openldap:
    image: osixia/openldap:1.5.0
    container_name: si-test-openldap
    profiles: ["oracle"]
    command: --copy-service
    environment:
      LDAP_ORGANISATION: SI Test
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "3389:389"
    volumes:
      - ./ldap-init/oracle-net.schema:/container/service/slapd/assets/config/bootstrap/schema/custom/oracle-net.schema
      - ./ldap-init/01_oracle_context.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/01_oracle_context.ldif

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 10.20.0.0/16
